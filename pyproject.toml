[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[project]
name = "scenewise"
version = "0.1.0"
description = "Self-hosted video understanding: captions, summaries, chapters, a moderation second opinion and labels."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Firu Daniel" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# Floors equal the versions verified on 2026-10-08 (q8c §3); uv.lock pins exactly.
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "structlog>=26.1.0",
  "httpx>=0.28.1",
  "pillow>=12.3.0",          # ImageReader is always needed (D3)
]

[project.optional-dependencies]
service = ["fastapi>=0.142.4", "uvicorn>=0.54.0", "anyio>=4.15.1"]  # anyio: admission, threads
asr = [                      # CPU only (q8c §3, D20, U4, U16, q11); no PyAV
  "sherpa-onnx>=1.13.8",
  # Its x86_64/arm64 wheels require sherpa-onnx-core, its armv7l wheel does not, and uv's
  # universal lock took the armv7l metadata and dropped core; listed so the lock has it.
  # Keep the two at the same version.
  "sherpa-onnx-core>=1.13.8",
  "onnx-asr>=0.12.0",        # no [hub], no [cpu]: weights are baked, onnxruntime is listed here
  "onnxruntime>=1.30.0",     # Silero loop, Whisper-tiny language ID (q11), onnx-asr
  "numpy>=2.5.3",
]
# Opt-in Whisper fallback recogniser (U4, U16). faster-whisper hard-requires PyAV, whose wheels
# bundle GPL x264/x265 (q10, q11): this extra brings GPL code into the process. Published images
# leave it out; whoever distributes an image built with it takes on q10 §3.
asr-whisper = ["faster-whisper>=1.2.1"]
llm-anthropic = ["anthropic[vertex]>=1.12.1"]   # first-party and Vertex AI (U5)
vision = ["open-clip-torch>=3.3.0", "timm>=1.0.17"]  # torch comes from a torch-* selector
gcs = ["google-cloud-storage>=3.16.0", "google-auth>=2.61.0"]
torch-cpu = ["torch>=2.14.1", "torchvision>=0.29.1"]
torch-cu130 = ["torch>=2.14.1", "torchvision>=0.29.1"]

[project.scripts]
scenewise = "scenewise.service.cli:main"

[project.urls]
Repository = "https://github.com/firu-daniel/scenewise"

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "ruff==0.16.10",
  "import-linter==2.15",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "pytest-randomly==5.0.0",
  "coverage[toml]==7.16.2",
  "hypothesis==6.168.5",
  "deptry==0.25.1",
  "vulture==2.16",
  "typos==1.51.1",
  "zizmor==1.30.1",
  "httpx2==2.13.1",
  "prek==0.5.5",             # runs .pre-commit-config.yaml (D6; pre-commit works too)          # starlette 1.7's TestClient deprecates httpx in favour of httpx2
]

# ---------------------------------------------------------------- uv
[tool.uv]
required-version = "==0.12.23"     # setup-uv installs exactly this; bump by PR
conflicts = [
  [{ extra = "torch-cpu" }, { extra = "torch-cu130" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", extra = "torch-cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "torch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", extra = "torch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# ---------------------------------------------------------------- project gates (read by scripts/)
[tool.scenewise.gates]
max_module_lines = 500             # physical lines, src + tests + scripts
suppression_budget = 2             # line-level noqa / type: ignore outside domain, app, ports

# ---------------------------------------------------------------- ruff
[tool.ruff]
required-version = "==0.16.10"
target-version = "py312"
line-length = 88                   # U11
src = ["src"]
extend-exclude = [
  "vulture_whitelist.py",   # generated by `vulture --make-whitelist`, reviewed by hand
  "docs/",                  # research record: ruff 0.16 would also reformat its Markdown code blocks
  "ARCHITECTURE.md",
  "ROADMAP.md",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213",   # mutually exclusive pydocstyle pairs (google convention below)
  "COM812",         # conflicts with ruff format (documented)
  "CPY001",         # no per-file copyright header
  "TD002",          # TODO author tag not required; TD003 (issue link) is enforced
  "FIX002",         # TODO allowed when it links an issue
  "DOC",            # pydoclint is preview-only in 0.16.x; not enforcing section lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",                # assert is the pytest idiom
  "D1",                  # no docstrings required on test modules/functions/classes
  "PLR2004",             # literal expectations
  "PLR0913", "PLR0917",  # pytest injects fixtures as positional parameters
  "FBT001",              # parametrized bool parameters
  "SLF001",              # tests may inspect private state
  "PLC0415",             # heavy adapters are imported inside fixtures, after importorskip
]
"scripts/**" = ["INP001", "T201"]   # standalone scripts, print is their output
"src/scenewise/service/bootstrap.py" = ["PLC0415"]   # the only lazy imports in src (q8a §1.5 rule 4)

[tool.ruff.lint.isort]
known-first-party = ["scenewise", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3    # src: constructors and options use keyword-only parameters (`*,`)
max-branches = 10
max-returns = 6            # ruff default; mapping functions need early returns
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.load".msg = "Load weights with safetensors; torch.load unpickles arbitrary code."
"pickle".msg = "No pickle: untrusted model/cache files must not execute code."
"subprocess.call".msg = "Use subprocess.run(check=True) via the ffmpeg adapter."
"typing.no_type_check".msg = "Do not switch off type checking; fix the types."

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = ["src", "."]
explicit_package_bases = true
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined",
  "redundant-self", "unused-awaitable", "explicit-override", "mutable-override",
  "deprecated", "exhaustive-match",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scenewise.domain.*", "scenewise.app.*", "scenewise.ports", "scenewise.ports.*"]
disallow_any_explicit = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib", "-m", "not model"]
markers = [
  "e2e: end-to-end tests that need ffmpeg on PATH",
  "model: tests that load real (tiny) ML models; tests/contract only; opt-in",
]
filterwarnings = ["error"]
pythonpath = ["."]          # lets tests import tests.contract.* shared suites
timeout = "60"              # pytest-timeout; the model tier overrides with --timeout

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source_pkgs = ["scenewise"]
relative_files = true
patch = ["subprocess"]       # measure `python -m scenewise` started by e2e tests

[tool.coverage.report]
fail_under = 90
# Heavy-extra adapters are omitted here and reported in the models job (D4). None exists
# yet; add each path to this list with the adapter (q8c §6.1 item 6).
omit = []
show_missing = true
skip_covered = true
# exclude_lines REPLACES coverage's default, so no "pragma: no cover" spelling excludes anything.
exclude_lines = [
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",           # Protocol bodies; mypy's empty-body error is the backstop elsewhere
  "@overload",
  "case _:\\n\\s*assert_never\\(",  # exhaustive match: mypy proves the arm unreachable
]
partial_branches = []          # likewise disables "pragma: no branch"

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

# ---------------------------------------------------------------- deptry / vulture / typos
[tool.deptry]
known_first_party = ["scenewise"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "uvicorn",                 # the ASGI server runs the app; it is not imported
  "torch", "torchvision",    # declared only to route via the PyTorch index (selector pair)
  "timm",                    # declared only to pin open-clip-torch's floor
  # Not imported yet; each leaves this list with the adapter that imports it:
  "httpx",                   # base: HTTP callbacks and the OpenAI-compatible adapter
  "sherpa-onnx", "sherpa-onnx-core", "onnx-asr", "onnxruntime", "numpy",  # item 1 (asr)
  "faster-whisper",          # item 1 (asr-whisper, the opt-in fallback; U16)
  "anthropic",                                                          # item 2 (llm)
  "open-clip-torch",                                                    # item 3/4 (vision)
  "google-cloud-storage", "google-auth",                                # GCS store, deployment
]

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
exclude = [                          # model-only wire modules: fields exist for the JSON shape
  "src/scenewise/app/contract/requests.py",
  "src/scenewise/app/contract/results.py",
]
ignore_names = ["model_config"]      # pydantic class configuration
ignore_decorators = ["@router.*", "@app.*"]  # FastAPI-registered handlers

[tool.typos.files]
# docs/ is the research record (quoted names such as Appen, FPR, CPY001); not checked.
extend-exclude = ["uv.lock", "tests/fixtures/**", "docs/**"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "scenewise"
include_external_packages = true
contract_types = ["allowed_externals: scripts.import_contracts.AllowedExternalsContract"]

[[tool.importlinter.contracts]]
name = "Layers: service > (adapters | app) > ports > domain"
type = "layers"
containers = ["scenewise"]
layers = ["service", "adapters | app", "ports", "domain"]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
name = "Adapter kinds are independent of each other"
type = "independence"
modules = ["scenewise.adapters.*"]

[[tool.importlinter.contracts]]
name = "Only the composition root imports adapters"
type = "protected"
protected_modules = ["scenewise.adapters"]
allowed_importers = ["scenewise.service.bootstrap"]

[[tool.importlinter.contracts]]
name = "Domain and ports: stdlib only (q8a §1.5 rule 6, as an allow-list)"
type = "allowed_externals"
source_modules = ["scenewise.domain", "scenewise.ports"]

[[tool.importlinter.contracts]]
name = "Use cases: stdlib, pydantic and structlog only (q8a §1.5 rule 6, as an allow-list)"
type = "allowed_externals"
source_modules = ["scenewise.app"]
allowed = ["pydantic", "pydantic_core", "structlog"]

[[tool.importlinter.contracts]]
name = "Driving side imports no ML or cloud SDK"
type = "forbidden"
source_modules = ["scenewise.service"]
forbidden_modules = [
  "torch", "torchvision", "onnxruntime", "onnx_asr", "sherpa_onnx", "ctranslate2",
  "faster_whisper", "open_clip", "timm", "transformers", "huggingface_hub", "safetensors",
  "numpy", "PIL", "anthropic", "google",
]
allow_indirect_imports = true   # bootstrap reaches adapters, and through them these libraries, by design
# bootstrap's `torch.version.cuda` probe (q8a §9.4) arrives with the vision adapters, and
# with it `ignore_imports = ["scenewise.service.bootstrap -> torch"]`; an unmatched entry
# is an error, so it is not listed before the import exists.
