# Local convenience hooks, runnable with `pre-commit` or `prek` (D6). CI is the gate:
# these run the same commands against /pyproject.toml through the locked dev group.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --config pyproject.toml
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --config pyproject.toml --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports --no-cache --config pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: gate-scripts
        name: module size, suppressions, stray config
        entry: bash -c 'uv run python scripts/check_module_size.py && uv run python scripts/check_suppressions.py && uv run python scripts/check_stray_config.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: typos
        name: typos
        entry: uv run typos --isolated --config pyproject.toml
        language: system
        pass_filenames: false
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
